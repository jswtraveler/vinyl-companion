name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 08:00 UTC. Supabase free tier pauses after 7 days of
    # inactivity; a 3-day cadence leaves margin for GitHub occasionally skipping
    # or delaying scheduled runs on busy infra.
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allow manual trigger

# GitHub disables scheduled workflows after 60 days with no repository activity.
# The "Keep repo active" step below commits a timestamp on each run, which
# resets that 60-day clock automatically -- so this stays alive even on a repo
# you rarely touch, with no manual upkeep.

# Allow the workflow to push the keepalive timestamp commit back to the repo.
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to Supabase keepalive table
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=eq.1" \
            -X PATCH \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"last_ping": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}')

          if [ "$response" -eq 204 ]; then
            echo "Supabase keep-alive write successful (HTTP $response)"
          else
            echo "::error::Supabase keep-alive write failed (HTTP $response)"
            echo "::error::Expected 204. Check that (1) the 'keepalive' table exists"
            echo "::error::(run database/migrations/add_keepalive_table.sql), and"
            echo "::error::(2) the SUPABASE_URL and SUPABASE_ANON_KEY repo secrets are set."
            exit 1
          fi

      - name: Keep repo active (reset GitHub's 60-day cron timer)
        uses: actions/checkout@v4

      - name: Commit keepalive timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          # Only commit if the timestamp actually changed (it always will), and
          # never fail the job if there is nothing to commit.
          if ! git diff --cached --quiet; then
            git commit -m "chore: keepalive timestamp [skip ci]"
            git push
          else
            echo "No change to commit."
          fi
